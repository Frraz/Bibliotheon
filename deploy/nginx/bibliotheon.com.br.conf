# nginx do HOST. Substitui o conteúdo de /etc/nginx/sites-available/bibliotheon (o link em sites-enabled já existe):
#   sudo cp /var/www/docker-instances/Bibliotheon/deploy/nginx/bibliotheon.com.br.conf /etc/nginx/sites-available/bibliotheon
#   sudo nginx -t && sudo systemctl reload nginx
# Porta 8020 = a do v1 (PORTA do .env). O certificado do domínio já existe. Não há DNS para www.
# O conf anterior (só proxy para 8020) já serve o v2: esta versão acrescenta o limite de taxa em /ir/ e o HSTS.

limit_req_zone $binary_remote_addr zone=bibliotheon_ir:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name bibliotheon.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bibliotheon.com.br;

    ssl_certificate     /etc/letsencrypt/live/bibliotheon.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bibliotheon.com.br/privkey.pem;   # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                            # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                              # managed by Certbot

    client_max_body_size 30m;   # uploads do painel e da CLI (Etapas 3 e 4)
    access_log off;

    # Saída rastreada: limita rajadas (evita encher as métricas)
    location /ir/ {
        limit_req zone=bibliotheon_ir burst=20 nodelay;
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
}
