# nginx do HOST. Copiar para /etc/nginx/sites-available/, ligar em sites-enabled/ e rodar:
#   sudo nginx -t && sudo systemctl reload nginx
# Depois do certificado (certbot --nginx), ele adiciona o bloco 443 e o redirect sozinho.
# Troque 8013 pela PORTA do .env.

limit_req_zone $binary_remote_addr zone=bibliotheon_ir:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name bibliotheon.com.br www.bibliotheon.com.br;

    client_max_body_size 30m;   # uploads do painel e da CLI (Etapas 3 e 4)

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # Saída rastreada: limita rajadas (evita encher as métricas)
    location /ir/ {
        limit_req zone=bibliotheon_ir burst=20 nodelay;
        proxy_pass http://127.0.0.1:8013;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8013;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cabeçalhos de segurança (o Next também envia os básicos)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
