name: bibliotheon
x-environment: &environment
  PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?Configure domínio público}
  PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Configure segredo do Payload}
  DATABASE_URL: ${DATABASE_URL:?Configure credencial limitada de runtime}
  MEDIA_DIR: /app/uploads
  TZ: America/Belem
  CHECKOUT_ALLOWED_HOSTS_HOTMART: ${CHECKOUT_ALLOWED_HOSTS_HOTMART:-}
  CHECKOUT_ALLOWED_HOSTS_KIWIFY: ${CHECKOUT_ALLOWED_HOSTS_KIWIFY:-}
  CHECKOUT_ALLOWED_HOSTS_CAKTO: ${CHECKOUT_ALLOWED_HOSTS_CAKTO:-}
x-hotmart-environment: &hotmart-environment
  HOTMART_WEBHOOK_ENABLED: ${HOTMART_WEBHOOK_ENABLED:-false}
  HOTMART_ACCOUNT_KEY: ${HOTMART_ACCOUNT_KEY:-}
  HOTMART_HOTTOK: ${HOTMART_HOTTOK:-}
  HOTMART_PREVIOUS_HOTTOK: ${HOTMART_PREVIOUS_HOTTOK:-}
x-kiwify-environment: &kiwify-environment
  KIWIFY_WEBHOOK_ENABLED: ${KIWIFY_WEBHOOK_ENABLED:-false}
  KIWIFY_ACCOUNT_KEY: ${KIWIFY_ACCOUNT_KEY:-}
  KIWIFY_WEBHOOK_TOKEN: ${KIWIFY_WEBHOOK_TOKEN:-}
  KIWIFY_WEBHOOK_PREVIOUS_TOKEN: ${KIWIFY_WEBHOOK_PREVIOUS_TOKEN:-}
x-cakto-environment: &cakto-environment
  CAKTO_WEBHOOK_ENABLED: ${CAKTO_WEBHOOK_ENABLED:-false}
  CAKTO_ACCOUNT_KEY: ${CAKTO_ACCOUNT_KEY:-}
  CAKTO_WEBHOOK_SECRET: ${CAKTO_WEBHOOK_SECRET:-}
  CAKTO_WEBHOOK_PREVIOUS_SECRET: ${CAKTO_WEBHOOK_PREVIOUS_SECRET:-}
x-mail-environment: &mail-environment
  LEAD_TOKEN_SECRET: ${LEAD_TOKEN_SECRET:-}
  LEADS_ENABLED: ${LEADS_ENABLED:-false}
  EMAIL_TRANSPORT_ENABLED: ${EMAIL_TRANSPORT_ENABLED:-false}
  BREVO_CONTACT_SYNC_ENABLED: ${BREVO_CONTACT_SYNC_ENABLED:-false}
  BREVO_CONTACT_REGISTRATION_ENABLED: ${BREVO_CONTACT_REGISTRATION_ENABLED:-false}
  BREVO_LIST_SYNC_ENABLED: ${BREVO_LIST_SYNC_ENABLED:-false}
  COMMERCIAL_EVENTS_ENABLED: ${COMMERCIAL_EVENTS_ENABLED:-false}
  DATA_RETENTION_ENABLED: ${DATA_RETENTION_ENABLED:-false}
  ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-false}
  BREVO_WEBHOOK_ENABLED: ${BREVO_WEBHOOK_ENABLED:-false}
  BREVO_WEBHOOK_TOKEN: ${BREVO_WEBHOOK_TOKEN:-}
  BREVO_WEBHOOK_PREVIOUS_TOKEN: ${BREVO_WEBHOOK_PREVIOUS_TOKEN:-}
  BREVO_WEBHOOK_EVENT_SECRET: ${BREVO_WEBHOOK_EVENT_SECRET:-}
  BREVO_CAMPAIGN_OBSERVE_ENABLED: ${BREVO_CAMPAIGN_OBSERVE_ENABLED:-false}
  BREVO_CAMPAIGN_SEND_ENABLED: ${BREVO_CAMPAIGN_SEND_ENABLED:-false}
  BREVO_CAMPAIGN_SYNC_ENABLED: ${BREVO_CAMPAIGN_SYNC_ENABLED:-false}
  BREVO_CAMPAIGN_SENDER_ID: ${BREVO_CAMPAIGN_SENDER_ID:-}
  BREVO_PREFERENCE_SYNC_ENABLED: ${BREVO_PREFERENCE_SYNC_ENABLED:-false}
  BREVO_LIST_FOLDER_ID: ${BREVO_LIST_FOLDER_ID:-}
  LEAD_REQUESTS_PER_ADDRESS_DAY: ${LEAD_REQUESTS_PER_ADDRESS_DAY:-5}
  BREVO_DAILY_QUOTA: ${BREVO_DAILY_QUOTA:-250}
  BREVO_TRANSACTIONAL_RESERVE: ${BREVO_TRANSACTIONAL_RESERVE:-50}
  BREVO_API_KEY: ${BREVO_API_KEY:-}
  BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
  BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Bibliotheon}
x-runtime: &runtime
  image: ${BIBLIOTHEON_IMAGE:?Informe imagem imutável com digest}
  environment: *environment
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }
services:
  app:
    <<: *runtime
    environment:
      <<: [*environment, *mail-environment, *hotmart-environment, *kiwify-environment, *cakto-environment]
      HOSTNAME: 0.0.0.0
    ports: ["127.0.0.1:${BIBLIOTHEON_PORT:?Escolha porta após inventário}:3000"]
    volumes: [media:/app/uploads, cache:/app/.next/cache]
    mem_limit: 1536m
    cpus: 0.75
    depends_on:
      db: { condition: service_healthy }
    networks: [private]
  worker:
    <<: *runtime
    profiles: [relationship]
    command: [node, cli/worker.js]
    environment:
      <<: [*environment, *mail-environment]
    volumes: [media:/app/uploads:ro]
    mem_limit: 768m
    cpus: 0.5
    stop_grace_period: 45s
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, cli/worker-health.js]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks: [private]
  migrate:
    <<: *runtime
    profiles: [maintenance]
    restart: "no"
    command: [node, cli/migrate.js]
    environment:
      <<: *environment
      DATABASE_URL: ${DATABASE_MIGRATION_URL:?Configure credencial de migração segregada}
    volumes: [media:/app/uploads]
    depends_on:
      db: { condition: service_healthy }
    networks: [private]
  db:
    image: postgres:17.9-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
    restart: unless-stopped
    environment:
      POSTGRES_DB: bibliotheon
      POSTGRES_USER: bibliotheon_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?Configure senha do owner do banco}
      DB_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD:?Configure senha do runtime}
    volumes:
      - database:/var/lib/postgresql/data
      - ./ops/init-database.sh:/docker-entrypoint-initdb.d/10-bibliotheon.sh:ro
    mem_limit: 1024m
    cpus: 0.5
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U bibliotheon_owner -d bibliotheon"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    networks: [private]
networks:
  private:
volumes:
  database:
  media:
  cache:
