name: Qualidade local reproduzida
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.9-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
        env:
          POSTGRES_DB: bibliotheon
          POSTGRES_USER: bibliotheon
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U bibliotheon -d bibliotheon"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TZ: America/Belem
      DATABASE_URL: postgresql://bibliotheon:synthetic-ci-only@127.0.0.1:55432/bibliotheon
      PAYLOAD_SECRET: synthetic-ci-only-not-used-outside-disposable-ci
      PUBLIC_SITE_URL: http://127.0.0.1:3000
      CHECKOUT_ALLOWED_HOSTS_HOTMART: pay.example.invalid
      CHECKOUT_ALLOWED_HOSTS_KIWIFY: pay.example.invalid
      CHECKOUT_ALLOWED_HOSTS_CAKTO: pay.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - run: npm exec --yes --package=pnpm@10.34.7 -- pnpm install --frozen-lockfile
      - name: Conferir arquivos gerados do CMS
        run: |
          npm run generate:types
          npm run generate:importmap
          git diff --exit-code -- src/payload-types.ts 'src/app/(payload)/admin/importMap.js'
      - run: python3 scripts/validar_documentacao.py
      - run: npm run lint && npm run typecheck && npm test
      - run: node node_modules/payload/bin.js migrate
      - run: npm run test:catalog
      - run: npm run test:marketing
      - run: npm run test:sequences
      - run: npm run build
      - name: Integração REST e Local API
        run: |
          touch .env.local
          npm start > /tmp/bibliotheon-ci.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health/ready > /dev/null; then break; fi
            sleep 1
          done
          npm run test:integration
          npm run test:site
          npm run test:admin-recovery
