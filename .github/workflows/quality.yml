name: Qualidade
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: qualidade-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  checks:
    name: Tipos, lint, unitários, operação e documentação
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TZ: America/Belem
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Instalar dependências pelo lockfile
        run: npm exec --yes --package=pnpm@10.34.7 -- pnpm install --frozen-lockfile
      - name: Verificações sem banco
        run: bash scripts/check-local.sh
  integration:
    name: Migrações, integrações sequenciais e build HTTP
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17.9-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
        env:
          POSTGRES_DB: bibliotheon
          POSTGRES_USER: bibliotheon
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U bibliotheon -d bibliotheon"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TZ: America/Belem
      BIBLIOTHEON_SYNTHETIC_TESTS: 'true'
      DATABASE_URL: postgresql://bibliotheon:synthetic-ci-only@127.0.0.1:55432/bibliotheon
      PAYLOAD_SECRET: synthetic-ci-only-not-used-outside-disposable-ci
      LEAD_TOKEN_SECRET: synthetic-ci-links-only-not-used-outside-disposable-ci
      PUBLIC_SITE_URL: http://127.0.0.1:3000
      LEADS_ENABLED: 'false'
      EMAIL_TRANSPORT_ENABLED: 'false'
      COMMERCIAL_EVENTS_ENABLED: 'false'
      BREVO_CONTACT_SYNC_ENABLED: 'false'
      BREVO_CONTACT_REGISTRATION_ENABLED: 'false'
      BREVO_LIST_SYNC_ENABLED: 'false'
      BREVO_CAMPAIGN_SEND_ENABLED: 'false'
      BREVO_CAMPAIGN_OBSERVE_ENABLED: 'false'
      HOTMART_WEBHOOK_ENABLED: 'false'
      KIWIFY_WEBHOOK_ENABLED: 'false'
      CAKTO_WEBHOOK_ENABLED: 'false'
      ANALYTICS_ENABLED: 'false'
      BREVO_WEBHOOK_ENABLED: 'false'
      CHECKOUT_ALLOWED_HOSTS_HOTMART: pay.example.invalid
      CHECKOUT_ALLOWED_HOSTS_KIWIFY: pay.example.invalid
      CHECKOUT_ALLOWED_HOSTS_CAKTO: pay.example.invalid
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm exec --yes --package=pnpm@10.34.7 -- pnpm install --frozen-lockfile
      - name: Conferir arquivos gerados do CMS
        run: |
          npm run generate:types
          npm run generate:importmap
          git diff --exit-code -- src/payload-types.ts 'src/app/(payload)/admin/importMap.js'
      - name: Aplicar todas as migrações no PostgreSQL descartável
        run: npm run db:migrate
      - name: Integrações de domínio em sequência
        run: bash scripts/check-integration.sh
      - name: Construir aplicação e CLIs
        run: |
          npm run build
          node scripts/build-runtime.mjs
      - name: Saúde, permissões e contratos HTTP
        run: bash scripts/check-http.sh
